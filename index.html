<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceHub</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navbar (Person 1) -->
    <header class="navbar">
        <div class="container">
            <div class="logo">FreelanceHub</div>
            <nav class="nav-links">
                <a href="#">Find Talent</a>
                <a href="#">Find Work</a>
                <a href="#">Why Us</a>
                <a href="#">Enterprise</a>
            </nav>
            <div class="auth-buttons">
                <a href="#" class="btn-login">Log In</a>
                <a href="#" class="btn-signup">Sign Up Free</a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Hero Section (Person 1) -->
        <section id="hero" class="container">
            <!-- Hero content goes here -->
        </section>

        <!-- Categories Section (Person 2) -->
        <section id="categories" class="container">
            <!-- Categories grid goes here -->
        </section>

        <!-- Freelancer Profile Cards (Person 2) -->
        <section id="top-talent" class="container">
            <!-- Freelancers content goes here -->
        </section>

        <!-- Process Steps (Person 3) -->
        <section id="process-steps" class="container">
            <!-- Process steps go here -->
        </section>

        <!-- Client vs Freelancer (Person 3) -->
        <section id="client-freelancer" class="container">
            <!-- Client vs freelancer cards go here -->
        </section>
        
        <!-- Image Cluster & Stats (Person 4) -->
        <section id="stats" class="container">
            <!-- Stats content goes here -->
        </section>
    </main>

    <!-- Footer (Person 4) -->
    <footer class="footer">
        <div class="container">
            <!-- Footer content goes here -->
        </div>
    </footer>

    <!-- Modals (All Categories / Coming Soon) -->
    <div id="modal-container"></div>

    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
